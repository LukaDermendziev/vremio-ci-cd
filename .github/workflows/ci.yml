name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py check

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py test --verbosity=2

  production-check:
    name: Production settings check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy readiness check
        env:
          DJANGO_SECRET_KEY: ci-production-check-secret-key-must-be-at-least-fifty-characters-long
          DJANGO_DEBUG: "False"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          DATABASE_SSLMODE: disable
          DJANGO_ALLOWED_HOSTS: www.example.com,example.com
          SITE_URL: https://www.example.com
          CUSTOMER_DOMAINS: www.example.com
          CUSTOMER_DOMAIN_SALON_SLUG: example-salon
          SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    name: Build and push image
    needs: [test, production-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/vremio-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
