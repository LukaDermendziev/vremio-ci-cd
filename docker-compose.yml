# Four services for the CI/CD course demo (not used by the live salon).
# nginx = entry, web = Django/Gunicorn, db = PostgreSQL, redis = cache.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: vremio-nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vremio-web:local
    container_name: vremio-web
    env_file:
      - infra/compose.env
    volumes:
      - vremio-media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: vremio-postgres
    environment:
      POSTGRES_DB: vremio
      POSTGRES_USER: vremio
      POSTGRES_PASSWORD: vremio-faculty-db
    volumes:
      - vremio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vremio -d vremio"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vremio-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - vremio-redis:/data
    restart: unless-stopped

volumes:
  vremio-postgres:
  vremio-redis:
  vremio-media:
