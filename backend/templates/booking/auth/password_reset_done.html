{% extends "booking/auth/base_auth.html" %}
{% block title %}Reset Link Sent{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-icon-circle"><i class="bi bi-envelope-check"></i></div>
  <h1 class="auth-title">Check your inbox</h1>
  <p class="auth-sub">If an account with that email exists, a password reset link has been sent. Check your spam folder if you don't see it.</p>
  <a href="{% url 'booking:owner_login' %}" class="auth-btn" style="display:block;text-align:center;margin-top:24px;">Back to login</a>
</div>
{% endblock %}
