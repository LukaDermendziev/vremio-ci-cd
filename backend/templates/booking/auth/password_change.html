{% extends "booking/auth/base_auth.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-logo"><i class="bi bi-key"></i></div>
  <h1 class="auth-title">Change password</h1>
  <p class="auth-sub">Update your account password.</p>

  <form method="post" class="auth-form">
    {% csrf_token %}
    {% for field in form %}
      <div class="auth-field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        <input
          type="password"
          id="{{ field.id_for_label }}"
          name="{{ field.html_name }}"
          class="auth-input{% if field.errors %} auth-input-error{% endif %}"
          {% if field.html_name == 'old_password' %}autocomplete="current-password"{% else %}autocomplete="new-password"{% endif %}
          required
        >
        {% if field.errors %}
          <span class="auth-field-error">{{ field.errors.0 }}</span>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="auth-btn">Update password</button>
  </form>

  <div style="margin-top:16px;text-align:center;">
    <a href="{% url 'booking:owner_dashboard' %}" class="auth-link-sm">Cancel</a>
  </div>
</div>
{% endblock %}
