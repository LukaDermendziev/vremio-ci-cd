{% extends "booking/auth/base_auth.html" %}
{% load i18n %}
{% block title %}{% trans "Reset Password" %}{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-logo"><i class="bi bi-lock"></i></div>
  <h1 class="auth-title">{% trans "Reset Password" %}</h1>
  <p class="auth-sub">{% trans "Enter your email and we'll send a reset link." %}</p>

  <form method="post" class="auth-form">
    {% csrf_token %}
    <div class="auth-field">
      <label for="id_email">{% trans "Email address" %}</label>
      <input type="email" id="id_email" name="email" class="auth-input" autofocus required>
    </div>
    <button type="submit" class="auth-btn">{% trans "Send reset link" %}</button>
  </form>

  <div style="margin-top:16px;text-align:center;">
    <a href="{% url 'booking:owner_login' %}" class="auth-link-sm">{% trans "Back to login" %}</a>
  </div>
</div>
{% endblock %}
