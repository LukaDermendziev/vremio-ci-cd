{% extends "booking/auth/base_auth.html" %}
{% block title %}Owner Login{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-logo">
    <i class="bi bi-scissors"></i>
  </div>
  <h1 class="auth-title">Owner Login</h1>
  <p class="auth-sub">Sign in to your salon dashboard</p>

  {% if error %}
    <div class="auth-alert">{{ error }}</div>
  {% endif %}

  <form method="post" class="auth-form">
    {% csrf_token %}
    <div class="auth-field">
      <label for="id_username">Username</label>
      <input type="text" id="id_username" name="username" class="auth-input" autofocus autocomplete="username" required>
    </div>
    <div class="auth-field">
      <label for="id_password">Password</label>
      <input type="password" id="id_password" name="password" class="auth-input" autocomplete="current-password" required>
    </div>
    <button type="submit" class="auth-btn">Sign in</button>
  </form>

  <div class="auth-row-between" style="margin-top:16px;">
    <a href="{% url 'booking:owner_password_reset' %}" class="auth-link-sm">Forgot password?</a>
  </div>
</div>
{% endblock %}
