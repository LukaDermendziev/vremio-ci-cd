{% extends "booking/auth/base_auth.html" %}
{% load i18n %}
{% block title %}{% trans "Password Reset Complete" %}{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-icon-circle"><i class="bi bi-check-circle"></i></div>
  <h1 class="auth-title">{% trans "Password updated" %}</h1>
  <p class="auth-sub">{% trans "Your password has been set. You can now sign in." %}</p>
  <a href="{% url 'booking:owner_login' %}" class="auth-btn" style="display:block;text-align:center;margin-top:24px;">{% trans "Go to login" %}</a>
</div>
{% endblock %}
