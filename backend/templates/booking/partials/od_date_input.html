{% load i18n %}
<div class="od-date-wrap" data-od-date-field{% if min_from %} data-od-date-min-from="{{ min_from }}"{% endif %}>
  <div class="od-date-input-row">
    <input
      type="text"
      class="od-input od-date-display"
      placeholder="{% trans 'dd/mm/yyyy' %}"
      inputmode="numeric"
      autocomplete="off"
      {% if required %}required{% endif %}
    >
    <button type="button" class="od-date-picker-btn" aria-label="{% trans 'Choose date' %}" aria-haspopup="dialog">
      <i class="bi bi-calendar3"></i>
    </button>
  </div>
  <input type="hidden" name="{{ name }}" class="od-date-value"{% if id %} id="{{ id }}"{% endif %}{% if value %} value="{{ value }}"{% endif %}>
</div>
