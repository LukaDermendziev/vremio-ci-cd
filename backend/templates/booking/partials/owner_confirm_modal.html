{% load i18n %}
<div class="od-modal-overlay od-confirm-overlay" id="od-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="od-confirm-title" hidden>
  <div class="od-modal-box od-confirm-modal">
    <div class="od-confirm-icon" aria-hidden="true">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h2 class="od-confirm-title" id="od-confirm-title">{% trans "Are you sure?" %}</h2>
    <p class="od-confirm-message" id="od-confirm-message"></p>
    <div class="od-confirm-actions">
      <button type="button" class="od-btn od-btn-ghost" id="od-confirm-cancel">{% trans "Cancel" %}</button>
      <button type="button" class="od-btn od-btn-danger" id="od-confirm-ok">{% trans "Delete" %}</button>
    </div>
  </div>
</div>
