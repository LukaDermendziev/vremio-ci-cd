{% load i18n %}
<div class="od-modal-overlay" id="od-booking-modal">
  <div class="od-modal-box od-modal-wide">
    <div class="od-modal-header">
      <span class="od-modal-title" id="od-booking-modal-title">{% trans "Add booking" %}</span>
      <button type="button" class="od-modal-close" data-close-modal="od-booking-modal">&times;</button>
    </div>
    <form method="post" id="od-booking-form" class="od-form">
      {% csrf_token %}
      <input type="hidden" name="action" value="save_booking">
      <input type="hidden" name="return_section" value="calendar">
      <input type="hidden" name="booking_id" value="">
      <div class="od-form-grid od-form-grid-2">
        <div class="od-field"><label>{% trans "Full name" %}</label><input type="text" name="full_name" required class="od-input"></div>
        <div class="od-field"><label>{% trans "Phone" %}</label><input type="tel" name="phone_number" required class="od-input"></div>
        <div class="od-field"><label>{% trans "Instagram" %}</label><input type="text" name="instagram_username" class="od-input"></div>
        <div class="od-field"><label>{% trans "Email" %}</label><input type="email" name="email" class="od-input"></div>
        <div class="od-field">
          <label>{% trans "Preferred contact" %}</label>
          <select name="preferred_contact_method" class="od-input">
            {% for value, label in owner_booking_form.fields.preferred_contact_method.choices %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="od-field">
          <label>{% trans "Service" %}</label>
          <select name="service" required class="od-input" id="od-booking-service">
            {% for service in services %}
              {% if service.is_active %}<option value="{{ service.id }}">{{ service.name }} ({{ service.duration_minutes }} {% trans "min" %})</option>{% endif %}
            {% endfor %}
          </select>
        </div>
        <div class="od-field"><label>{% trans "Date" %}</label><input type="date" name="date" required class="od-input" id="od-booking-date"></div>
        <div class="od-field">
          <label>{% trans "Start time" %}</label>
          <select id="od-owner-slots" class="od-input"></select>
          <input type="hidden" name="start_time" id="od-booking-start-time" value="">
          <p id="od-slots-warning" style="display:none;color:#DC2626;font-size:12px;margin:4px 0 0 0;line-height:1.4"></p>
        </div>
        <div class="od-field">
          <label>{% trans "Status" %}</label>
          <select name="status" class="od-input">
            {% for value, label in owner_booking_form.fields.status.choices %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="od-field">
          <label>{% trans "Source" %}</label>
          <select name="source" class="od-input">
            {% for value, label in owner_booking_form.fields.source.choices %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="od-field"><label>{% trans "Owner note" %}</label><textarea name="owner_note" rows="2" class="od-input"></textarea></div>
      <div class="od-booking-photo-section" id="od-booking-photo-section" hidden>
        <div class="od-field-label">{% trans "Reference photo" %}</div>
        <div class="od-booking-photo-empty" id="od-booking-photo-empty">{% trans "No photo attached" %}</div>
        <div class="od-booking-photo-preview" id="od-booking-photo-preview" hidden>
          <button type="button" class="od-bk-photo-thumb od-bk-photo-thumb-lg" id="od-booking-photo-thumb">
            <img id="od-booking-photo-img" src="" alt="{% trans 'Reference photo' %}">
            <span>{% trans "View reference photo" %}</span>
          </button>
        </div>
      </div>
      <div class="od-modal-footer od-modal-footer-split">
        <button type="button" class="od-btn od-btn-danger od-delete-btn" id="od-booking-delete" style="display:none">{% trans "Delete" %}</button>
        <div class="od-modal-footer-right">
          <button type="button" class="od-btn od-btn-ghost" data-close-modal="od-booking-modal">{% trans "Cancel" %}</button>
          <button type="submit" class="od-btn od-btn-primary">{% trans "Save booking" %}</button>
        </div>
      </div>
    </form>
    <form method="post" id="od-booking-delete-form" style="display:none">
      {% csrf_token %}
      <input type="hidden" name="action" value="delete_booking">
      <input type="hidden" name="return_section" value="calendar">
      <input type="hidden" name="booking_id" value="">
    </form>
  </div>
</div>
