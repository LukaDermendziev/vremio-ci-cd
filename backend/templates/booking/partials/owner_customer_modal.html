{% load i18n %}
<div class="od-modal-overlay" id="od-customer-modal">
  <div class="od-modal-box od-modal-wide">
    <div class="od-modal-header">
      <span class="od-modal-title" id="od-customer-modal-title">{% trans "Add customer" %}</span>
      <button type="button" class="od-modal-close" data-close-modal="od-customer-modal">&times;</button>
    </div>
    <form method="post" id="od-customer-form" class="od-form" autocomplete="off">
      {% csrf_token %}
      <input type="hidden" name="action" value="save_customer">
      <input type="hidden" name="return_section" value="customers">
      <input type="hidden" name="customer_id" value="">
      <div class="od-form-grid od-form-grid-2">
        <div class="od-field"><label>{% trans "Full name" %}</label><input type="text" name="full_name" required class="od-input" autocomplete="off"></div>
        <div class="od-field"><label>{% trans "Phone" %}</label><input type="tel" name="phone_number" required class="od-input" autocomplete="off"></div>
        <div class="od-field"><label>{% trans "Instagram" %}</label><input type="text" name="instagram_username" class="od-input" autocomplete="off"></div>
        <div class="od-field"><label>{% trans "Email" %}</label><input type="email" name="email" class="od-input" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="od-field">
          <label>{% trans "Preferred contact" %}</label>
          <select name="preferred_contact_method" class="od-input">
            {% for value, label in customer_form.fields.preferred_contact_method.choices %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="od-modal-footer od-modal-footer-split">
        <button type="button" class="od-btn od-btn-danger od-delete-btn" id="od-customer-delete" style="display:none">{% trans "Delete" %}</button>
        <button type="button" class="od-btn od-btn-danger od-btn-sm" id="od-customer-block" style="display:none"
                data-open-block-customer>{% trans "Block customer" %}</button>
        <div class="od-modal-footer-right">
          <button type="button" class="od-btn od-btn-ghost" data-close-modal="od-customer-modal">{% trans "Cancel" %}</button>
          <button type="submit" class="od-btn od-btn-primary">{% trans "Save customer" %}</button>
        </div>
      </div>
    </form>
    <form method="post" id="od-customer-delete-form" style="display:none">
      {% csrf_token %}
      <input type="hidden" name="action" value="delete_customer">
      <input type="hidden" name="return_section" value="customers">
      <input type="hidden" name="customer_id" value="">
    </form>
  </div>
</div>
