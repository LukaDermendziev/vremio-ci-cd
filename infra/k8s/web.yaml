# Django + Gunicorn. Image comes from Docker Hub (CI/CD pipeline).
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: vremio
  labels:
    app.kubernetes.io/name: vremio
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: vremio
  labels:
    app.kubernetes.io/name: vremio
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vremio
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h db -p 5432 -U vremio; do echo waiting for db; sleep 2; done
      containers:
        - name: web
          image: lukad23/vremio-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: vremio-config
            - secretRef:
                name: vremio-secret
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          emptyDir: {}
