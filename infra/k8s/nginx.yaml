apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: vremio
  labels:
    app.kubernetes.io/name: vremio
    app.kubernetes.io/component: nginx
data:
  default.conf: |
    upstream vremio_web {
        server web:8000;
    }

    server {
        listen 80;
        server_name vremio.local localhost;

        client_max_body_size 8m;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://vremio_web;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: vremio
  labels:
    app.kubernetes.io/name: vremio
    app.kubernetes.io/component: nginx
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: vremio
  labels:
    app.kubernetes.io/name: vremio
    app.kubernetes.io/component: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vremio
        app.kubernetes.io/component: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: nginx-config
