# Reverse proxy in front of Django/Gunicorn.
# The browser talks to nginx; nginx forwards to the web service.
upstream vremio_web {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 8m;

    # $http_host keeps the browser port (8080). $host is hostname only, so
    # Django APPEND_SLASH would redirect /health -> http://localhost/health/
    location / {
        proxy_pass http://vremio_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
